<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80">

  <!-- Primeiro texto -->
  <text
    x="600"
    y="48"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="24"
    font-weight="bold">

    <tspan fill="#F2B5D4">I'm</tspan>
    <tspan fill="#C4A7E7"> Thurtuguita</tspan>

    <animate
      attributeName="opacity"
      values="1;1;0;0"
      keyTimes="0;0.4;0.5;1"
      dur="6s"
      repeatCount="indefinite"/>
  </text>

  <!-- Segundo texto -->
  <text
    x="600"
    y="48"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="24"
    font-weight="bold">

    <tspan fill="#F2B5D4">Welcome</tspan>
    <tspan fill="#C4A7E7"> to my</tspan>
    <tspan fill="#7BA7D9"> world!</tspan>
    <tspan fill="#F2B5D4"> (♡˙︶˙♡)</tspan>

    <animate
      attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;0.5;0.6;1"
      dur="6s"
      repeatCount="indefinite"/>
  </text>

</svg>
