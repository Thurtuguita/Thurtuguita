```xml
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80"> <!-- tamanho -->

  <defs>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4A7E7"/>
      <stop offset="50%" stop-color="#F2B5D4"/>
      <stop offset="100%" stop-color="#7BA7D9"/>
    </linearGradient> <!-- fundo -->
  </defs>

  <!-- Primeiro texto -->
  <text
    x="600"
    y="48"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="24"
    font-weight="bold"
    fill="#C4A7E7">

    I'm Thurtuguita

    <animate
      attributeName="opacity"
      values="1;1;0;0"
      keyTimes="0;0.4;0.5;1"
      dur="6s"
      repeatCount="indefinite"/>
  </text>

  <!-- Segundo texto -->
  <text
    x="600"
    y="48"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="24"
    font-weight="bold"
    fill="url(#text-gradient)">

    Welcome to my world! (♡˙︶˙♡)

    <animate
      attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;0.5;0.6;1"
      dur="6s"
      repeatCount="indefinite"/>
  </text>

</svg>
