<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80">

  <defs>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7595"/>
      <stop offset="50%" stop-color="#d865f8"/>
      <stop offset="100%" stop-color="#7BA7D9"/>
    </linearGradient>

    <clipPath id="typing-clip">
      <rect x="0" y="0" width="0" height="80">
        <animate
          attributeName="width"
          values="0;1200;1200;0"
          keyTimes="0;0.4;0.7;1"
          dur="6s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Primeiro texto -->
  <text
    x="600"
    y="48"
    text-anchor="middle"
    font-family="Courier New, Courier, monospace"
    font-size="28"
    font-weight="bold"
    fill="url(#text-gradient)"
    clip-path="url(#typing-clip)">

    I'm Thurtuguita

    <animate
      attributeName="opacity"
      values="1;1;0;0"
      keyTimes="0;0.4;0.5;1"
      dur="12s"
      repeatCount="indefinite"/>
  </text>

  <!-- Segundo texto -->
  <text
    x="600"
    y="48"
    text-anchor="middle"
    font-family="Courier New, Courier, monospace"
    font-size="28"
    font-weight="bold"
    fill="url(#text-gradient)"
    clip-path="url(#typing-clip)">

    Welcome to my world! ⋆ദ്ദി(˵ •̀ ᴗ - ˵ )

    <animate
      attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;0.5;0.6;1"
      dur="12s"
      repeatCount="indefinite"/>
  </text>

</svg>
